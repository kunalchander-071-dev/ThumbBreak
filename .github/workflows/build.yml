name: Build & distribute

on:
  push:
    branches: [main, 'release-*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates Gradle/boilerplate files that aren't committed yet; existing files are kept.
      - name: Scaffold missing platform files
        run: |
          flutter create --org com.thumbbreak --project-name thumbbreak --platforms android .
          rm -rf test
          sed -i 's/applicationId = "com.thumbbreak.thumbbreak"/applicationId = "com.thumbbreak.app"/' android/app/build.gradle.kts
          grep -q 'applicationId = "com.thumbbreak.app"' android/app/build.gradle.kts

      # Stable signing key so updates install over the previous build.
      # Without the secret, each build gets a throwaway key (uninstall before updating).
      - name: Install signing key
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=0.1.${{ github.run_number }}

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message }}
